name: Due
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
targets:
  Due:
    type: application
    platform: iOS
    sources: [Due]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.due
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Due
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: '4'
        MARKETING_VERSION: '1.0.1'
  DueTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DueTests]
    dependencies:
      - target: Due
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Due:
    build:
      targets:
        Due: all
    test:
      targets: [DueTests]
